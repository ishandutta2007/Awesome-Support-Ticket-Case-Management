<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-18px) translateX(12px); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 8, 8; animation: dashFlow 25s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 17px; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Glowing Ambience (Behind everything) -->
  <circle class="orb-1" cx="220" cy="100" r="140" fill="url(#cardGlow)" />
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="url(#cardGlow)" />

  <!-- Animated Dynamic Workflow Lines (Behind text) -->
  <path class="flow-line" d="M 50 80 Q 300 20 600 80 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="flow-line" d="M 80 290 Q 400 340 750 280 T 1120 270" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.2" />

  <!-- Floating Dynamic Particle Accents -->
  <circle class="particle-1" cx="140" cy="160" r="4" fill="#38bdf8" opacity="0.7" />
  <circle class="particle-2" cx="1060" cy="110" r="5" fill="#a855f7" opacity="0.6" />
  <circle class="particle-3" cx="980" cy="290" r="3.5" fill="#34d399" opacity="0.7" />
  <circle class="particle-1" cx="260" cy="280" r="3" fill="#60a5fa" opacity="0.5" />

  <!-- Border Gradient Stroke -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Top Pill / Status Tag -->
  <g transform="translate(435, 34)">
    <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#38bdf8" letter-spacing="1">CURATED IT &amp; CUSTOMER SUPPORT DIRECTORY</text>
  </g>

  <!-- Foreground Main Title & Graphic Accent (High Contrast, Centered, Stays Crystal Clear) -->
  <g id="ForegroundContent">
    <!-- Icon Symbol (Helpdesk Ticket / Shield / Support Symbol) -->
    <g transform="translate(600, 110)">
      <!-- Animated subtle accent ring -->
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="2" filter="url(#dropShadow)" />
      <!-- Ticket & Headset Icon -->
      <path d="M -12 -8 L -12 8 A 2 2 0 0 0 -10 10 L 10 10 A 2 2 0 0 0 12 8 L 12 -8 A 2 2 0 0 0 10 -10 L -10 -10 A 2 2 0 0 0 -12 -8 Z M -6 -3 L 6 -3 M -6 3 L 2 3" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" class="title-text">
      Support Ticket &amp; Case Management
    </text>

    <!-- Gradient Sub-highlight Underline -->
    <rect x="420" y="196" width="360" height="3" rx="1.5" fill="url(#accentGrad)" />

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="232" text-anchor="middle" class="subtitle-text">
      The authoritative curated guide to enterprise SaaS platforms &amp; powerful open-source alternatives
    </text>

    <!-- Interactive / Feature Showcase Badges (Foreground Cards) -->
    <g transform="translate(230, 268)">
      <!-- Badge 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" />
        <text x="36" y="26" class="tag-text">Enterprise SaaS</text>
      </g>

      <!-- Badge 2: Open-Source -->
      <g transform="translate(190, 0)">
        <rect width="175" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="22" cy="21" r="5" fill="#10b981" />
        <text x="36" y="26" class="tag-text">Open-Source Hub</text>
      </g>

      <!-- Badge 3: ITSM & ITIL -->
      <g transform="translate(395, 0)">
        <rect width="165" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="22" cy="21" r="5" fill="#818cf8" />
        <text x="36" y="26" class="tag-text">ITSM &amp; ITIL Ready</text>
      </g>

      <!-- Badge 4: AI & Automation -->
      <g transform="translate(590, 0)">
        <rect width="150" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="22" cy="21" r="5" fill="#c084fc" />
        <text x="36" y="26" class="tag-text">AI Deflection</text>
      </g>
    </g>
  </g>
</svg>
